services:
  mongodb:
    image: mongo:7
    container_name: pms-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - pms-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pms-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=mongodb://mongodb:27017/project-management
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-secure-random-string}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
    depends_on:
      - mongodb
    networks:
      - pms-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
    container_name: pms-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - pms-network

volumes:
  mongodb_data:

networks:
  pms-network:
    driver: bridge
